<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>TV Pro</title>

<script src="https://cdn.dashjs.org/latest/dash.all.min.js"></script>

<style>
body {
  margin: 0;
  background: #0b0b0b;
  color: white;
  font-family: Arial;
}

header {
  padding: 15px;
  font-size: 24px;
  font-weight: bold;
  background: black;
}

.player {
  width: 100%;
  max-height: 400px;
  background: black;
}

video {
  width: 100%;
  height: 400px;
}

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, 160px);
  gap: 15px;
  padding: 20px;
}

.card {
  background: #1a1a1a;
  border-radius: 10px;
  padding: 10px;
  text-align: center;
  cursor: pointer;
  transition: 0.2s;
}

.card:hover, .active {
  transform: scale(1.1);
  background: #e50914;
}

</style>
</head>

<body>

<header>TV PRO</header>

<div class="player">
  <video id="videoPlayer" controls autoplay></video>
</div>

<div class="grid" id="canales"></div>

<script>
let canales = [];
let currentIndex = 0;
let player = dashjs.MediaPlayer().create();

// 🔗 Cargar lista M3U
fetch("https://raw.githubusercontent.com/MarcosAriel32/lista/refs/heads/main/flow.m3u")
.then(res => res.text())
.then(text => {
  parseM3U(text);
  renderCanales();
  if (canales.length > 0) reproducir(0);
});

// 📺 Parsear M3U
function parseM3U(data) {
  const lines = data.split("\n");

  for (let i = 0; i < lines.length; i++) {
    if (lines[i].startsWith("#EXTINF")) {
      let nombre = lines[i].split(",")[1] || "Canal";
      let url = lines[i+1];

      canales.push({ nombre, url });
    }
  }
}

// 🎬 Reproducir canal
function reproducir(index) {
  currentIndex = index;

  let url = canales[index].url;

  // MPD con DASH
  if (url.includes(".mpd")) {
    player.initialize(document.querySelector("#videoPlayer"), url, true);
  } else {
    document.querySelector("#videoPlayer").src = url;
  }

  document.querySelectorAll(".card").forEach((c,i)=>{
    c.classList.toggle("active", i === index);
  });
}

// 🧱 UI canales
function renderCanales() {
  const grid = document.getElementById("canales");
  grid.innerHTML = "";

  canales.forEach((c, i) => {
    let div = document.createElement("div");
    div.className = "card";
    div.innerText = c.nombre;
    div.onclick = () => reproducir(i);
    grid.appendChild(div);
  });
}

// 🎮 CONTROL REMOTO (teclado / smart TV)
document.addEventListener("keydown", e => {
  if (e.key === "ArrowRight") {
    currentIndex = (currentIndex + 1) % canales.length;
    reproducir(currentIndex);
  }
  if (e.key === "ArrowLeft") {
    currentIndex = (currentIndex - 1 + canales.length) % canales.length;
    reproducir(currentIndex);
  }
  if (e.key === "Enter") {
    reproducir(currentIndex);
  }
});

</script>

</body>
</html>
